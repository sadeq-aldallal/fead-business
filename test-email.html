<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test n8n Email Integration</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #22c55e; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test n8n Email Integration</h1>
    
    <form id="testForm">
        <div class="form-group">
            <label for="type">Email Type:</label>
            <select id="type" required>
                <option value="contact">Contact Form</option>
                <option value="demo">Demo Request</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" value="Test User" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" value="test@example.com" required>
        </div>
        
        <div id="subjectGroup" class="form-group">
            <label for="subject">Subject:</label>
            <input type="text" id="subject" value="Testing n8n Integration">
        </div>
        
        <div id="companyGroup" class="form-group" style="display: none;">
            <label for="company">Company:</label>
            <input type="text" id="company" value="Test Company">
        </div>
        
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" rows="4" required>This is a test message to verify the n8n webhook integration is working properly.</textarea>
        </div>
        
        <button type="submit">Test Email Send</button>
    </form>
    
    <div id="result"></div>

    <script>
        const form = document.getElementById('testForm');
        const typeSelect = document.getElementById('type');
        const subjectGroup = document.getElementById('subjectGroup');
        const companyGroup = document.getElementById('companyGroup');
        const result = document.getElementById('result');
        
        // Show/hide fields based on type
        typeSelect.addEventListener('change', function() {
            if (this.value === 'demo') {
                subjectGroup.style.display = 'none';
                companyGroup.style.display = 'block';
            } else {
                subjectGroup.style.display = 'block';
                companyGroup.style.display = 'none';
            }
        });
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };
            
            const type = typeSelect.value;
            
            if (type === 'contact') {
                formData.subject = document.getElementById('subject').value;
            } else {
                formData.company = document.getElementById('company').value;
            }
            
            const payload = {
                type: type,
                formData: formData,
                timestamp: new Date().toISOString()
            };
            
            try {
                result.innerHTML = '<div class="result">Sending...</div>';
                
                const response = await fetch('https://fead.app.n8n.cloud/webhook-test/fead-app-emails', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    result.innerHTML = '<div class="result success">✅ Email sent successfully! Check your n8n workflow execution logs.</div>';
                } else {
                    const errorText = await response.text();
                    result.innerHTML = `<div class="result error">❌ Error: ${response.status} - ${errorText}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="result error">❌ Network Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
